env_type: libero
task_suite_name: libero_spatial

# Same split seed as the training env, evaluated on the held-out (test) stems.
suite_split:
  seed: 0
  subset: test
  train_fraction: 0.8

total_num_envs: null

auto_reset: True
ignore_terminations: True
max_steps_per_rollout_epoch: 480
max_episode_steps: 480

use_rel_reward: False
use_step_penalty: False
reward_coef: 1.0

# RLinf LiberoEnv specific settings
reset_gripper_open: True
is_eval: True

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: True

specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/eval

init_params:
  camera_heights: 224
  camera_widths: 224
