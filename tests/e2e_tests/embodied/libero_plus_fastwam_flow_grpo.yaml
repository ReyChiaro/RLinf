# E2E (smoke) test for FastWAM + Flow-GRPO on LIBERO-Plus (sparse success reward).
# Requires: the sylvestf/LIBERO-plus fork installed as `libero` + assets, a
# FastWAM LIBERO-SFT checkpoint and its dataset_stats.json.
# Run with: bash run.sh libero_plus_fastwam_flow_grpo
defaults:
  - env/libero_plus_spatial_train@env.train
  - env/libero_plus_spatial_eval@env.eval
  - model/fastwam@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results/libero_plus_fastwam_flow_grpo_e2e"
    project_name: rlinf
    experiment_name: "test_fastwam_flow_grpo"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  group_size: 2
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: null
  gamma: 1.0
  gae_lambda: 1.0
  filter_rewards: False

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 8
    group_size: ${algorithm.group_size}
    max_steps_per_rollout_epoch: 64
    max_episode_steps: 64
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    max_steps_per_rollout_epoch: 64
    max_episode_steps: 64

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_type: ${actor.model.model_type}
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 8
  seed: 42
  enable_offload: False

  model:
    model_path: "/path/to/model/fastwam-libero-sft"
    stats_path: "/path/to/dataset_stats.json"
    num_action_chunks: 8
    num_flow_steps: 4
    noise_level: 1.0

  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    # Frozen conditioning + trainable action expert inside one model tree
    # require FSDP to keep original params.
    use_orig_params: True
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16

reward:
  use_reward_model: False

critic:
  use_critic_model: False
